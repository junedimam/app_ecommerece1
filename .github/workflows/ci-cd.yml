name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  test:
    name: Test Services
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, product-catalog, cart-service, payment-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install dependencies
        working-directory: services/${{ matrix.service }}
        run: npm install

      - name: Run lint
        working-directory: services/${{ matrix.service }}
        run: npx eslint . --ext .js --no-error-on-unmatched-pattern || echo "Lint skipped or no config found"

      - name: Run tests
        working-directory: services/${{ matrix.service }}
        run: npm test --if-present

  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Run SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    name: Build and Push Docker Images
    needs: [test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, product-catalog, cart-service, payment-service, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/github-actions-ecr-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set build context
        id: context
        run: |
          if [ "${{ matrix.service }}" = "frontend" ]; then
            echo "path=./frontend" >> "$GITHUB_OUTPUT"
          else
            echo "path=./services/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        env:
          ECR_REPOSITORY: flixstore-${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ${{ steps.context.outputs.path }}

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_REGISTRY }}/flixstore-${{ matrix.service }}:${{ github.sha }}'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Push image to Amazon ECR
        env:
          ECR_REPOSITORY: flixstore-${{ matrix.service }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  update-manifests:
    name: Update GitOps Manifests
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, product-catalog, cart-service, payment-service, frontend]
    steps:
      - name: Checkout manifests repo
        uses: actions/checkout@v4
        with:
          repository: junedimam/k8s-manifests
          token: ${{ secrets.MANIFESTS_REPO_PAT }}
          path: k8s-manifests

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update image tag
        working-directory: k8s-manifests/apps/${{ matrix.service }}
        run: |
          kustomize edit set image flixstore-${{ matrix.service }}=${{ env.ECR_REGISTRY }}/flixstore-${{ matrix.service }}:${{ github.sha }}

      - name: Commit and push
        working-directory: k8s-manifests
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "Update ${{ matrix.service }} image to ${{ github.sha }}" || echo "No changes to commit"
          git push
