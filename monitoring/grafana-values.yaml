adminPassword: admin123

service:
  type: LoadBalancer
  port: 80
  targetPort: 3000

persistence:
  enabled: true
  size: 5Gi

grafana.ini:
  smtp:
    enabled: true
    host: smtp.gmail.com:587
    user: "your-email@gmail.com"
    password: "APP_PASSWORD"
    from_address: "your-email@gmail.com"
    from_name: "FlixStore Monitoring"

# Grafana will use this SMTP configuration for email alert notifications.
# Replace the Gmail values with your actual SMTP credentials and app password.

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.monitoring.svc.cluster.local:80
        access: proxy
        isDefault: true

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    kubernetes-cluster:
      gnetId: 3119
      revision: 1
      datasource: Prometheus
    kubernetes-pods:
      gnetId: 6417
      revision: 1
      datasource: Prometheus
    node-exporter:
      gnetId: 1860
      revision: 1
      datasource: Prometheus

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  limits:
    memory: 512Mi
    cpu: 200m
