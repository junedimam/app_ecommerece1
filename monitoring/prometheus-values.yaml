# Prometheus Helm values for monitoring
alertmanager:
  enabled: true
  persistence:
    enabled: true
    size: 2Gi
  extraSecretMounts:
    - name: grafana-smtp
      mountPath: /etc/alertmanager/secrets/grafana-smtp
      secretName: grafana-smtp
      readOnly: true
  config:
    global:
      resolve_timeout: 5m
      smtp_smarthost: smtp.gmail.com:587
      smtp_from: junedimam994@gmail.com
      smtp_auth_username: junedimam994@gmail.com
      smtp_auth_password_file: /etc/alertmanager/secrets/grafana-smtp/smtp-password
    route:
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: flixstore-email
      routes:
        - matchers:
            - severity="critical"
          receiver: flixstore-email
        - matchers:
            - severity="warning"
          receiver: flixstore-email
    receivers:
      - name: flixstore-email
        email_configs:
          - to: junedimam994@gmail.com
            send_resolved: true

server:
  persistentVolume:
    enabled: true
    size: 8Gi

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 200m

  global:
    scrape_interval: 15s
    evaluation_interval: 15s

  serverFiles:
    alerting_rules.yml:
      groups:
        - name: flixstore-application
          rules:
            - alert: FlixStoreDeploymentReplicasUnavailable
              expr: kube_deployment_status_replicas_unavailable{namespace="flixstore"} > 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "FlixStore deployment has unavailable replicas"
                description: "Deployment {{ $labels.deployment }} has unavailable replicas."
            - alert: FlixStorePodNotReady
              expr: kube_pod_status_ready{namespace="flixstore",condition="true"} == 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "FlixStore pod is not ready"
                description: "Pod {{ $labels.pod }} has not been ready for 10 minutes."
            - alert: FlixStorePodCrashLooping
              expr: max_over_time(kube_pod_container_status_waiting_reason{namespace="flixstore",reason="CrashLoopBackOff"}[5m]) >= 1
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "FlixStore pod is crash looping"
                description: "Pod {{ $labels.pod }} container {{ $labels.container }} is in CrashLoopBackOff."
            - alert: FlixStoreContainerRestarting
              expr: increase(kube_pod_container_status_restarts_total{namespace="flixstore"}[10m]) > 3
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "FlixStore container is restarting"
                description: "Container {{ $labels.container }} in pod {{ $labels.pod }} restarted more than 3 times in 10 minutes."
            - alert: FlixStoreDeploymentUnavailable
              expr: kube_deployment_status_replicas_available{namespace="flixstore"} == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "FlixStore deployment is unavailable"
                description: "Deployment {{ $labels.deployment }} has no available replicas."

  extraScrapeConfigs: |
    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_pod_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_pod_name]
          action: replace
          target_label: kubernetes_pod_name

    - job_name: 'kubernetes-service-endpoints'
      kubernetes_sd_configs:
        - role: endpoints
      relabel_configs:
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
          action: keep
          regex: true
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme]
          action: replace
          target_label: __scheme__
          regex: (https?)
        - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
          action: replace
          target_label: __metrics_path__
          regex: (.+)
        - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
          action: replace
          regex: ([^:]+)(?::\d+)?;(\d+)
          replacement: $1:$2
          target_label: __address__
        - action: labelmap
          regex: __meta_kubernetes_service_label_(.+)
        - source_labels: [__meta_kubernetes_namespace]
          action: replace
          target_label: kubernetes_namespace
        - source_labels: [__meta_kubernetes_service_name]
          action: replace
          target_label: kubernetes_name

    - job_name: 'node-exporter'
      kubernetes_sd_configs:
        - role: node
      relabel_configs:
        - action: labelmap
          regex: __meta_kubernetes_node_label_(.+)

    - job_name: 'kube-state-metrics'
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
          action: keep
          regex: kube-state-metrics

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

pushgateway:
  enabled: false
